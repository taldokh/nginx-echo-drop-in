# Config mounted into both containers for the custom-config cases, so the two
# nginx builds are compared running exactly the same configuration.

user  nginx;
worker_processes  1;

error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    off;

    server {
        listen       80 default_server;
        server_name  localhost;

        root   /usr/share/nginx/test;
        index  index.html;

        # Regex location with a capture (exercises PCRE2).
        location ~ ^/regex/(\d+)$ {
            default_type  text/plain;
            return  200 "id=$1\n";
        }

        location = /no-content {
            return  204;
        }

        location /old/ {
            rewrite  ^/old/(.*)$  /new/$1  permanent;
        }
    }
}
